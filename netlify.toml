[build]
  command = "prisma generate && prisma db push --accept-data-loss && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Dummy DATABASE_URL for build time (real one set in Netlify env vars)
  DATABASE_URL = "postgresql://dummy:dummy@localhost:5432/dummy"

[[plugins]]
  package = "@netlify/plugin-nextjs"
